<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#edf0f4"><title>GameHub</title>
<style>
:root{--bg:#edf0f4;--surface:#fff;--panel:#f8f9fb;--ink:#171b24;--muted:#758094;--line:#dce2eb;--blue:#2865d9;--blue2:#e8efff;--shadow:0 8px 26px #1a29400b}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,Segoe UI,sans-serif;min-height:100vh}.app{min-height:100vh;padding-left:58px}.rail{position:fixed;z-index:5;left:0;top:0;bottom:0;width:58px;background:#fff;border-right:1px solid var(--line);display:flex;align-items:center;flex-direction:column;padding:12px 0;gap:10px}.rail a,.rail button{width:36px;height:36px;border:0;border-radius:10px;background:transparent;color:#748096;text-decoration:none;display:grid;place-items:center;font-size:15px;font-weight:700;cursor:pointer}.rail a.active,.rail a:hover,.rail button:hover{background:var(--blue2);color:var(--blue)}.rail .spacer{flex:1}.rail .glyph{font-size:12px;letter-spacing:-1px}.top{height:82px;padding:10px 22px 8px;background:#fff;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}.tabline,.addressline{display:flex;align-items:center;gap:10px}.tab{height:28px;min-width:150px;max-width:230px;border-radius:9px 9px 5px 5px;background:#edf1f7;display:flex;align-items:center;gap:9px;padding:0 12px;font-size:11px;color:#5e6879}.tab.active{background:var(--blue);color:white}.tab-dot{width:8px;height:8px;border-radius:3px;background:currentColor}.addtab{border:0;background:transparent;color:#6f7b90;font-size:18px;cursor:pointer}.address{height:30px;flex:1;min-width:0;border:1px solid var(--line);border-radius:9px;background:#f6f8fb;color:#647086;padding:0 12px;display:flex;align-items:center;gap:8px;font-size:11px}.lock{color:var(--blue);font-size:12px}.topright{display:flex;align-items:center;gap:8px}.topright select{height:30px;border:1px solid var(--line);border-radius:8px;padding:0 9px;background:#fff;color:#4f5b70;font-size:10px;max-width:170px}.topright button{height:30px;border:1px solid var(--line);background:white;border-radius:8px;padding:0 10px;color:#59657a;font-size:11px;cursor:pointer}
main{max-width:1600px;margin:auto;padding:30px 28px 26px}.center{max-width:760px;margin:0 auto;text-align:center}.logo{font-size:58px;line-height:1;font-weight:850;letter-spacing:-4px;color:var(--blue);margin:20px 0 8px}.tagline{font-size:12px;color:#606d82;margin-bottom:30px}.searchwrap{height:48px;max-width:660px;margin:0 auto 22px;border:1px solid var(--line);border-radius:13px;background:#fff;display:flex;align-items:center;padding:0 8px 0 16px;box-shadow:var(--shadow)}.searchwrap span{color:#8390a4;font-size:17px;margin-right:10px}.searchwrap input{border:0;outline:0;background:transparent;flex:1;min-width:0;color:var(--ink);font:inherit;font-size:13px}.searchwrap button{height:32px;width:36px;border:0;border-radius:9px;background:var(--blue);color:white;font-size:17px;cursor:pointer}.quicklinks{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}.quick{width:62px;border:0;background:transparent;color:#667186;cursor:pointer;font-size:10px}.quick .qbox{width:50px;height:50px;margin:0 auto 6px;border:1px solid var(--line);border-radius:13px;background:#fff;display:grid;place-items:center;color:var(--blue);font-size:17px;font-weight:700;transition:.15s}.quick:hover .qbox{background:var(--blue2);border-color:#c5d5f5;transform:translateY(-2px)}.status{display:flex;justify-content:center;gap:8px;margin:20px 0 18px}.status span{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 11px;color:#67748a;font-size:10px}.clock{width:190px;min-height:122px;margin:0 auto 28px;border:1px solid var(--line);border-radius:15px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:var(--shadow)}.clock strong{font-size:30px;letter-spacing:-1px}.clock small{font-size:10px;color:var(--muted);margin-top:3px}
.bottom-head{display:flex;align-items:center;justify-content:space-between;margin:10px 0 12px}.bottom-head h2{font-size:15px;margin:0;letter-spacing:-.3px}.bottom-head button{border:0;background:transparent;color:var(--blue);font-size:11px;cursor:pointer}.featured-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.game-tile{min-height:112px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:space-between;min-width:0;transition:.16s}.game-tile:hover{transform:translateY(-2px);border-color:#b8caed}.tile-meta{display:flex;justify-content:space-between;gap:6px;align-items:center}.tile-meta small{font-size:9px;color:var(--blue);background:var(--blue2);padding:3px 6px;border-radius:5px}.tile-meta button{border:0;background:transparent;color:#8a95a7;cursor:pointer;font-size:16px}.game-tile strong{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.game-tile p{font-size:10px;color:var(--muted);margin:3px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catalog{margin:35px auto 0;max-width:1100px;display:none}.catalog.open{display:block}.catalog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.catalog h2{font-size:18px;margin:0}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.filter{border:1px solid var(--line);border-radius:8px;background:#fff;color:#627087;padding:7px 11px;font-size:11px;cursor:pointer}.filter.active{background:var(--blue2);border-color:#c4d5f7;color:#2057bf}.game-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.game-card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:13px;min-width:0}.game-card strong{font-size:12px}.game-card p{font-size:10px;color:var(--muted);min-height:28px;margin:5px 0}.card-actions{display:flex;justify-content:space-between;align-items:center}.card-actions small{font-size:9px;color:var(--blue)}.card-actions button{border:1px solid #cbd8f0;background:#f4f7ff;color:#245cc3;border-radius:6px;padding:6px 9px;font-size:10px;cursor:pointer}.empty{display:none;color:var(--muted);padding:25px;text-align:center}.footer{max-width:1600px;margin:26px auto 0;padding:13px 28px 20px;color:#8a94a5;font-size:10px;display:flex;justify-content:space-between}
@media(max-width:1050px){.featured-row{grid-template-columns:repeat(3,minmax(0,1fr))}.game-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.clock{margin-bottom:23px}}@media(max-width:650px){.app{padding-left:45px}.rail{width:45px}.top{padding:8px 10px;height:78px}.topright select{max-width:118px;font-size:9px}.topright button{display:none}.tab{min-width:120px}.addressline{gap:6px}main{padding:18px 12px}.logo{font-size:48px;margin-top:25px}.quicklinks{gap:8px}.quick{width:54px}.quick .qbox{width:44px;height:44px}.featured-row{grid-template-columns:repeat(2,minmax(0,1fr))}.game-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.footer{padding:12px;display:block}.footer span{display:block;margin:4px 0}}@media(max-width:390px){.featured-row,.game-grid{grid-template-columns:1fr}.status{flex-wrap:wrap}.topright select{max-width:104px}}
</style></head>
<body><aside class="rail"><a class="active" href="#home" aria-label="Home">H</a><a href="#catalog" aria-label="Games">G</a><a href="#categories" aria-label="Categories">C</a><button id="railFav" aria-label="Favorites">♡</button><div class="spacer"></div><a href="#footer" aria-label="About">i</a></aside>
<div class="app"><header class="top"><div class="tabline"><div class="tab active"><span class="tab-dot"></span>GameHub · Home</div><button class="addtab" aria-label="New tab">+</button></div><div class="addressline"><div class="address"><span class="lock">●</span><span>gamehub.local / home</span></div><div class="topright"><select id="launchMode" aria-label="Game opening mode"><option value="site">Open on game site</option><option value="blank">Open in about:blank</option></select><button id="toggleCatalog">All games</button></div></div></header>
<main id="home"><section class="center"><div class="logo">GameHub</div><div class="tagline">Find a game. Take a break. Play.</div><div class="searchwrap"><span>⌕</span><input id="search" placeholder="Search for a game..." aria-label="Search games"><button id="searchGo" aria-label="Show games">→</button></div><div class="quicklinks" id="categories"><button class="quick" data-category="Arcade"><span class="qbox">A</span>Arcade</button><button class="quick" data-category="Puzzle"><span class="qbox">P</span>Puzzle</button><button class="quick" data-category="Racing"><span class="qbox">R</span>Racing</button><button class="quick" data-category="Sports"><span class="qbox">S</span>Sports</button><button class="quick" data-category="Classic"><span class="qbox">C</span>Classic</button><button class="quick" data-category="Sandbox"><span class="qbox">B</span>Sandbox</button></div><div class="status"><span>30 games available</span><span>6 categories to explore</span></div><div class="clock"><strong id="clockTime">--:--</strong><small id="clockDate">Loading date...</small></div></section>
<section><div class="bottom-head"><h2 id="featuredTitle">Featured games</h2><button id="viewAll">View all games →</button></div><div class="featured-row" id="featuredRow"></div></section>
<section class="catalog" id="catalog"><div class="catalog-head"><h2>All games</h2><span id="resultCount" style="font-size:11px;color:var(--muted)">30 games</span></div><div class="filters"><button class="filter active" data-filter="All">All</button><button class="filter" data-filter="Arcade">Arcade</button><button class="filter" data-filter="Puzzle">Puzzle</button><button class="filter" data-filter="Racing">Racing</button><button class="filter" data-filter="Sports">Sports</button><button class="filter" data-filter="Classic">Classic</button><button class="filter" data-filter="Sandbox">Sandbox</button><button class="filter" data-filter="Favorites">Favorites</button></div><div class="game-grid" id="gameGrid"></div><div class="empty" id="empty">No games found.</div></section>
</main><footer class="footer" id="footer"><span>GameHub · Your browser gaming library.</span><span>Games are provided by their original websites.</span></footer></div>
<script>
const games=[["Slope","Arcade","Fast downhill reflex game","https://slopegame.io/"],["Run 3","Arcade","Run through space tunnels","https://www.coolmathgames.com/0-run-3"],["Subway Surfers","Arcade","Dodge obstacles and keep running","https://poki.com/en/g/subway-surfers"],["Temple Run 2","Arcade","Run through ancient ruins","https://poki.com/en/g/temple-run-2"],["Crossy Road","Arcade","Cross roads and rivers","https://poki.com/en/g/crossy-road"],["Doodle Jump","Arcade","Jump higher and higher","https://poki.com/en/g/doodle-jump"],["Flappy Bird","Arcade","Fly through the gaps","https://flappybird.io/"],["Pac-Man","Classic","Classic maze chase","https://www.google.com/logos/2010/pacman10-i.html"],["Agar.io","Arcade","Grow by collecting cells","https://agar.io/"],["Paper.io 2","Arcade","Claim territory on the board","https://paper-io.com/"],["2048","Puzzle","Combine tiles to reach 2048","https://play2048.co/"],["Chess","Puzzle","Play chess against a computer","https://www.chess.com/play/computer"],["Checkers","Puzzle","Classic strategy board game","https://papergames.io/en/checkers"],["Sudoku","Puzzle","Solve a number puzzle","https://sudoku.com/"],["Cookie Clicker","Classic","Build a cookie empire","https://orteil.dashnet.org/cookieclicker/"],["World's Hardest Game","Puzzle","A challenging precision game","https://www.coolmathgames.com/0-worlds-hardest-game"],["Fireboy & Watergirl","Puzzle","Solve platform puzzles together","https://www.coolmathgames.com/0-fireboy-and-water-girl"],["Moto X3M","Racing","Race through stunt tracks","https://poki.com/en/g/moto-x3m"],["Drift Hunters","Racing","Practice your drifting","https://drifthunters.io/"],["Drift Boss","Racing","Stay on the twisting track","https://driftboss.io/"],["Basketball Stars","Sports","Play fast basketball matches","https://www.miniclip.com/games/basketball-stars/en/"],["Soccer Skills","Sports","Take on a soccer challenge","https://poki.com/en/g/soccer-skills-world-cup"],["Tetris","Puzzle","Fit falling blocks together","https://tetris.com/play-tetris"],["Google Snake","Classic","A classic snake game","https://www.google.com/fbx?fbx=snake_arcade"],["UNO","Classic","Play the classic card game","https://www.crazygames.com/game/uno-online"],["Tic-Tac-Toe","Classic","A quick classic match","https://papergames.io/en/tic-tac-toe"],["Little Alchemy 2","Puzzle","Combine elements to discover","https://littlealchemy2.com/"],["Minecraft Classic","Sandbox","Build in a classic sandbox","https://classic.minecraft.net/"],["Eaglercraft","Sandbox","Browser-based block-building game","https://eaglercraft.com/"],["Stack","Arcade","Stack blocks as high as you can","https://stackgame.io/"]];
let category="All",favorites=new Set(JSON.parse(localStorage.getItem("gamehub-favorites")||"[]"));
const search=document.getElementById("search"),grid=document.getElementById("gameGrid"),catalog=document.getElementById("catalog"),featured=document.getElementById("featuredRow");
function launch(g){if(document.getElementById("launchMode").value==="site"){const w=window.open(g[3],"_blank","noopener");if(!w)alert("Allow pop-ups for this site to open games.");return}const w=window.open("about:blank","_blank");if(!w){alert("Allow pop-ups for this site to open games.");return}const title=g[0].replace(/[<>&"]/g,"");const url=g[3].replace(/&/g,"&amp;").replace(/"/g,"&quot;");w.document.open();w.document.write("<!doctype html><html><head><meta charset='utf-8'><title>"+title+"</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;overflow:hidden}iframe{display:block}</style></head><body><iframe src='"+url+"' allow='fullscreen; autoplay; gamepad' title='Game'></iframe></body></html>");w.document.close()}
function toggleCatalog(show=true){catalog.classList.toggle("open",show);if(show)catalog.scrollIntoView({behavior:"smooth",block:"start"})}
function tile(g,compact=false){const el=document.createElement("article");el.className=compact?"game-tile":"game-card";if(compact){const meta=document.createElement("div");meta.className="tile-meta";const tag=document.createElement("small");tag.textContent=g[1];const fav=document.createElement("button");fav.textContent=favorites.has(g[0])?"♥":"♡";fav.setAttribute("aria-label","Favorite "+g[0]);fav.onclick=()=>favorite(g[0]);meta.append(tag,fav);const name=document.createElement("strong");name.textContent=g[0];const desc=document.createElement("p");desc.textContent=g[2];el.append(meta,name,desc);el.onclick=e=>{if(e.target!==fav)launch(g)};el.style.cursor="pointer"}else{const name=document.createElement("strong");name.textContent=g[0];const desc=document.createElement("p");desc.textContent=g[2];const actions=document.createElement("div");actions.className="card-actions";const tag=document.createElement("small");tag.textContent=g[1];const play=document.createElement("button");play.textContent="PLAY →";play.onclick=()=>launch(g);actions.append(tag,play);el.append(name,desc,actions)}return el}
function favorite(name){favorites.has(name)?favorites.delete(name):favorites.add(name);localStorage.setItem("gamehub-favorites",JSON.stringify([...favorites]));render()}
function render(){const term=search.value.trim().toLowerCase();const matching=games.filter(g=>(category==="All"||(category==="Favorites"?favorites.has(g[0]):g[1]===category))&&(g.join(" ").toLowerCase().includes(term)));grid.innerHTML="";matching.forEach(g=>grid.append(tile(g)));document.getElementById("resultCount").textContent=matching.length+" games";document.getElementById("empty").style.display=matching.length?"none":"block";featured.innerHTML="";const picks=(category==="All"?games.slice(0,5):matching.slice(0,5));picks.forEach(g=>featured.append(tile(g,true)));document.getElementById("featuredTitle").textContent=category==="All"?"Featured games":category+" games"}
document.querySelectorAll("[data-category]").forEach(b=>b.onclick=()=>{category=b.dataset.category;document.querySelectorAll(".filter").forEach(f=>f.classList.toggle("active",f.dataset.filter===category));render();toggleCatalog(true)});document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{category=b.dataset.filter;document.querySelectorAll(".filter").forEach(f=>f.classList.toggle("active",f===b));render()});document.getElementById("toggleCatalog").onclick=()=>toggleCatalog(!catalog.classList.contains("open"));document.getElementById("viewAll").onclick=()=>toggleCatalog(true);document.getElementById("searchGo").onclick=()=>{toggleCatalog(true);render()};search.oninput=()=>{if(search.value)toggleCatalog(true);render()};document.getElementById("railFav").onclick=()=>{category="Favorites";document.querySelectorAll(".filter").forEach(f=>f.classList.toggle("active",f.dataset.filter==="Favorites"));render();toggleCatalog(true)};
function updateClock(){const d=new Date();document.getElementById("clockTime").textContent=d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});document.getElementById("clockDate").textContent=d.toLocaleDateString([],{weekday:"long",month:"long",day:"numeric"})}updateClock();setInterval(updateClock,30000);render();
</script></body></html>
